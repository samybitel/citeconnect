# CiteConnect — configuration Wasmer Edge
# Déploiement : `wasmer deploy` depuis ce dossier.
# Doc : https://docs.wasmer.io/edge/configuration/

kind: wasmer.io/App.v0
owner: samybitel
name: citeconnect
package: .

# Base PostgreSQL managée (une par app).
# Wasmer injecte DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD.
# L'app construit sa connexion automatiquement (voir src/lib/database-url.ts).
capabilities:
  database:
    engine: postgres

# Volume persistant pour les documents privés (CNI, passeports, avatars).
# L'app y écrit via STORAGE_DIR. Les volumes sont régionaux : même région que l'app.
volumes:
  - name: storage
    mount: /data

# Région (France). Base + volume + app doivent être dans la même région.
locality:
  regions:
    - fr-roub1

# Erreurs détaillées dans les réponses HTTP (runtime Node beta : indispensable pour diagnostiquer).
debug: true

env:
  # URL publique réelle de l'app Wasmer (l'ancienne citeconnect.wasmer.app sert la démo statique).
  APP_URL: "https://citeconnect2.wasmer.app"
  APP_NAME: "CiteConnect"
  SESSION_COOKIE_NAME: "cc_session"
  SESSION_TTL_DAYS: "7"
  BCRYPT_ROUNDS: "12"
  STORAGE_DIR: "/data"
  DEMO_MODE: "true"