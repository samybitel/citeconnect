# CiteConnect — pile de production : application Next.js + PostgreSQL.
# Les variables ${...} sont lues depuis le fichier .env placé à côté de ce fichier.
#   cp .env.production.example .env   puis adaptez les valeurs.
#
# Démarrer :   docker compose up -d --build
# Journaux :   docker compose logs -f app
# Arrêter :    docker compose down
# Tout effacer (base + documents) : docker compose down -v   (DESTRUCTIF)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-citeconnect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citeconnect} -d ${POSTGRES_DB:-citeconnect}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Aucun port publié : la base reste accessible uniquement sur le réseau interne.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-citeconnect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citeconnect}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-CiteConnect}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cc_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      STORAGE_DIR: /app/storage
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-false}
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  storage: